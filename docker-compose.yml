services:
  trakt_mcpserver:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: trakt_mcpserver
    ports:
      - "${TRAKT_MCP_SERVER_LOCAL_PORT:-8080}:8080"
    env_file:
      - .env
    environment:
      - TRAKT_CLIENT_ID=${TRAKT_CLIENT_ID:-}
      - TRAKT_CLIENT_SECRET=${TRAKT_CLIENT_SECRET:-}
      - TRAKT_AUTH_TOKEN_PATH=/data/auth_token.json
    volumes:
      - trakt_auth:/data
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request as u; u.urlopen('http://127.0.0.1:8080/healthz', timeout=4)"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  trakt_auth:
